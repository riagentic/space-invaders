name: release

# A `v*` tag builds the desktop app on each OS (aio packages Electron only on
# its own OS) and attaches the packages to that tag's GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install aio (am + Deno)
        run: |
          curl -fsSL https://raw.githubusercontent.com/riagentic/aio/main/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - run: am fix
      - run: deno task check
      - run: deno task test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # appimagetool runs without FUSE on a CI runner.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # aio derives the build number from the git history.
          fetch-depth: 0
      - name: Install aio (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/riagentic/aio/main/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Install aio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/riagentic/aio/main/install.ps1 | iex
          "$env:USERPROFILE\.deno\bin" >> $env:GITHUB_PATH
      - name: Link aio
        shell: pwsh
        run: am fix
      - name: Build
        shell: pwsh
        run: deno task build --targets=electron
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object Name -ne 'manifest.json'
          gh release upload $env:GITHUB_REF_NAME $files.FullName --clobber
